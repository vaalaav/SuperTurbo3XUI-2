name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Линтеры (shellcheck, ruff, actionlint)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: ruff (закреплён по хешу)
        run: python3 -m pip install --user --require-hashes --no-deps -r tests/requirements-lint.txt
      - name: actionlint (закреплён по контрольной сумме)
        env:
          AL_VERSION: "1.7.12"
          AL_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          f="actionlint_${AL_VERSION}_linux_amd64.tar.gz"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/$f" "https://github.com/rhysd/actionlint/releases/download/v${AL_VERSION}/$f"
          echo "${AL_SHA256}  $RUNNER_TEMP/$f" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$f" -C "$RUNNER_TEMP" actionlint
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Проверки
        run: |
          shellcheck --version | sed -n 2p
          bash tests/lint.sh

  secrets:
    name: Секреты в истории (gitleaks)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: gitleaks (закреплён по контрольной сумме)
        env:
          GL_VERSION: "8.30.1"
          GL_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          f="gitleaks_${GL_VERSION}_linux_x64.tar.gz"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/$f" "https://github.com/gitleaks/gitleaks/releases/download/v${GL_VERSION}/$f"
          echo "${GL_SHA256}  $RUNNER_TEMP/$f" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$f" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git --no-banner --redact .
          "$RUNNER_TEMP/gitleaks" dir --no-banner --redact .

  unit:
    name: Модульные тесты
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: bash tests/unit.sh

  e2e-module05:
    name: Модуль 05 на чистой машине (${{ matrix.scenario }})
    needs: [lint, unit]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        scenario: [fresh, upgrade, no-ip-limit, psiphon]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Сценарий
        env:
          SCENARIO: ${{ matrix.scenario }}
        run: sudo E2E_DISPOSABLE=1 E2E_LOG_DIR="$RUNNER_TEMP/e2e-logs" bash tests/e2e/module05.sh "$SCENARIO"
      - name: Диагностика при падении
        if: failure()
        # Учётные данные в логах — тестовые значения фикстуры, на этой машине больше ничего нет.
        run: |
          sudo bash tests/e2e/diagnose.sh "$RUNNER_TEMP/e2e-logs"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: e2e-logs-${{ matrix.scenario }}
          path: ${{ runner.temp }}/e2e-logs
          retention-days: 7

  nginx-config:
    name: Конфигурация nginx (nginx.org stable, nginx -t)
    needs: [lint]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: nginx из nginx.org (как в модуле 02, с проверкой отпечатка ключа)
        env:
          # Отпечаток ключа подписи пакетов nginx, опубликованный на nginx.org/en/linux_packages.html.
          NGINX_KEY_FPR: 573BFD6B3D8FBC641079A6ABABF5BD827BD9BF62 # gitleaks:allow — публичный отпечаток ключа, не секрет
        run: |
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/nginx_signing.key" https://nginx.org/keys/nginx_signing.key
          gpg --show-keys --with-colons "$RUNNER_TEMP/nginx_signing.key" | awk -F: '/^fpr/ {print $10}' | grep -qx "$NGINX_KEY_FPR"
          gpg --batch --yes --dearmor -o "$RUNNER_TEMP/nginx.gpg" "$RUNNER_TEMP/nginx_signing.key"
          sudo install -m 644 "$RUNNER_TEMP/nginx.gpg" /usr/share/keyrings/nginx-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/nginx-archive-keyring.gpg] https://nginx.org/packages/ubuntu $(lsb_release -cs) nginx" \
            | sudo tee /etc/apt/sources.list.d/nginx.list >/dev/null
          printf "Package: *\nPin: origin nginx.org\nPin: release o=nginx\nPin-Priority: 900\n" | sudo tee /etc/apt/preferences.d/99nginx >/dev/null
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq nginx
      - run: sudo E2E_DISPOSABLE=1 bash tests/nginx/check_config.sh
