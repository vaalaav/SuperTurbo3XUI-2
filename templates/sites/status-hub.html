<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="build-id" content="__BUILD__">
  <title>__BRAND__ System Status</title>
  <style>
    body{margin:0;font-family:system-ui,-apple-system,sans-serif;background:#f8fafc;color:#0f172a}
    .wrap{max-width:760px;margin:0 auto;padding:2.5rem 1.25rem}
    .banner{background:#ecfdf5;border:1px solid #a7f3d0;color:#065f46;padding:1rem 1.25rem;border-radius:10px;font-weight:600;margin-bottom:1.5rem}
    .list{background:#fff;border:1px solid #e2e8f0;border-radius:10px;overflow:hidden}
    .row{display:flex;justify-content:space-between;padding:1rem 1.25rem;border-bottom:1px solid #e2e8f0}
    .row:last-child{border-bottom:0}.ok{color:#059669;font-weight:600}
    footer{margin-top:2rem;color:#64748b;font-size:.85rem}
  </style>
</head>
<body>
  <div class="wrap">
    <h1 style="margin:0 0 1rem">__BRAND__ Status</h1>
    <div class="banner">All systems operational &mdash; __REGION__</div>
    <div class="list">
      <div class="row"><span>Edge Ingress (__DOMAIN__)</span><span class="ok">Operational</span></div>
      <div class="row"><span>Telemetry &amp; Metrics Collector</span><span class="ok">Operational</span></div>
      <div class="row"><span>Internal API Gateway (v__VERSION__)</span><span class="ok">Operational</span></div>
      <div class="row"><span>Artifact Registry Sync</span><span class="ok">Operational</span></div>
    </div>
    <footer>Node __DOMAIN__ &bull; Region __REGION__ &bull; Build __BUILD__</footer>
  </div>
</body>
</html>
