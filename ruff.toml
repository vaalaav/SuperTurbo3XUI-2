# Проверка Python в CI (tests/lint.sh). Набор правил задан явно, чтобы не зависеть от настроек ruff на машине.
target-version = "py310"
line-length = 120

[lint]
# E/F — ошибки и неиспользуемое, B — типичные баги, S — проверки безопасности (как bandit), I — порядок импортов.
select = ["E4", "E7", "E9", "F", "B", "S", "I"]

[lint.per-file-ignores]
# urlopen: схема URL везде задана константой (http://127.0.0.1:<порт> панели, фиксированный ip-api).
"lib/**" = ["S310"]
# Тесты: assert, локальный HTTP-сервер и синтетические токены/пароли фикстур.
"tests/**" = ["S101", "S104", "S105", "S106", "S107"]
